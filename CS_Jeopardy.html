<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 CS Jeopardy — Edexcel GCSE Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-1: #060e2b;
    --blue-2: #0a1744;
    --blue-3: #0e236a;
    --blue-4: #1338a0;
    --blue-glow: #2b6aff;
    --gold: #d4a017;
    --gold-bright: #ffd644;
    --gold-dim: #a07a10;
    --white: #f0f2ff;
    --dim: #6070a0;
    --correct: #22cc55;
    --wrong: #ee3344;
    --purple: #8844ee;
    --orange: #ff8822;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--blue-1);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === INTRO === */
  #intro {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  #intro.hidden { display: none; }

  .j-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 5rem);
    letter-spacing: 6px;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 60%, var(--gold-dim) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 0.2rem;
  }

  .j-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--blue-glow);
    letter-spacing: 4px;
    margin-bottom: 2.5rem;
  }

  .setup-card {
    background: var(--blue-2);
    border: 1px solid rgba(43, 106, 255, 0.2);
    border-radius: 16px;
    padding: 2rem;
    max-width: 500px;
    width: 100%;
    text-align: left;
  }

  .setup-card h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 1rem;
  }

  .team-setup {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }

  .team-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .team-color {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .team-row input {
    flex: 1;
    background: var(--blue-1);
    border: 1px solid rgba(43, 106, 255, 0.3);
    color: var(--white);
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    outline: none;
  }

  .team-row input:focus {
    border-color: var(--gold);
  }

  .team-row input::placeholder { color: var(--dim); }

  .add-team-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    background: transparent;
    border: 1px dashed var(--dim);
    color: var(--dim);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .add-team-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .remove-team-btn {
    background: transparent;
    border: none;
    color: var(--wrong);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.3rem;
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .remove-team-btn:hover { opacity: 1; }

  .start-btn {
    display: block;
    width: 100%;
    margin-top: 1rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 3px;
    padding: 1rem;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border: none;
    color: var(--blue-1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .start-btn:hover {
    box-shadow: 0 0 30px rgba(212, 160, 23, 0.3);
    transform: translateY(-1px);
  }

  /* === GAME BOARD === */
  #game { display: none; padding: 0.8rem; }
  #game.show { display: block; }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .score-chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--blue-2);
    border: 2px solid transparent;
    border-radius: 50px;
    padding: 0.4rem 1rem;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s;
    cursor: pointer;
    user-select: none;
  }

  .score-chip.active {
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(212, 160, 23, 0.3);
  }

  .score-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .score-pts {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--gold);
  }

  .turn-label {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--dim);
    margin-bottom: 0.8rem;
    letter-spacing: 1px;
  }

  .turn-label strong {
    color: var(--gold);
  }

  /* Board grid */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    max-width: 900px;
    margin: 0 auto;
  }

  .cat-header {
    background: var(--blue-3);
    border-radius: 6px;
    padding: 0.6rem 0.3rem;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(0.65rem, 1.8vw, 0.95rem);
    letter-spacing: 1px;
    color: var(--gold);
    line-height: 1.2;
  }

  .cell {
    background: var(--blue-4);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 0.3rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    color: var(--gold-bright);
    letter-spacing: 1px;
    min-height: 55px;
    position: relative;
  }

  .cell:hover:not(.used) {
    background: var(--blue-glow);
    color: var(--white);
    box-shadow: 0 0 15px rgba(43, 106, 255, 0.4);
    transform: scale(1.03);
  }

  .cell.used {
    background: var(--blue-1);
    color: transparent;
    cursor: default;
    opacity: 0.3;
  }

  .cell.daily-double-reveal {
    background: linear-gradient(135deg, var(--orange), var(--purple));
    animation: dd-pulse 1s infinite;
  }

  @keyframes dd-pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 136, 34, 0.3); }
    50% { box-shadow: 0 0 25px rgba(255, 136, 34, 0.6); }
  }

  /* === QUESTION MODAL === */
  .q-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }

  .q-overlay.show { display: flex; }

  .q-modal {
    background: var(--blue-2);
    border: 1px solid rgba(43, 106, 255, 0.3);
    border-radius: 20px;
    padding: 2rem;
    max-width: 650px;
    width: 100%;
    text-align: center;
    animation: modalIn 0.4s ease;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-cat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 2px;
    margin-bottom: 0.3rem;
  }

  .q-points {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--gold);
    margin-bottom: 1rem;
  }

  .q-dd-banner {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--orange);
    letter-spacing: 3px;
    margin-bottom: 0.5rem;
    display: none;
  }

  .q-dd-banner.show { display: block; }

  .q-text {
    font-size: 1.1rem;
    line-height: 1.7;
    margin-bottom: 1.5rem;
    color: var(--white);
  }

  .q-text code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(43, 106, 255, 0.15);
    color: var(--blue-glow);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.95em;
  }

  /* Reveal answer section */
  .q-answer-area {
    margin-top: 1rem;
  }

  .reveal-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    padding: 0.8rem 2.5rem;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border: none;
    color: var(--blue-1);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .reveal-btn:hover {
    box-shadow: 0 0 20px rgba(212, 160, 23, 0.4);
    transform: scale(1.03);
  }

  .answer-box {
    display: none;
    margin-top: 1.2rem;
    padding: 1.2rem;
    background: rgba(34, 204, 85, 0.08);
    border: 1px solid var(--correct);
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--correct);
    line-height: 1.5;
  }

  .answer-box.show { display: block; }

  .answer-box .answer-explain {
    font-weight: 400;
    font-size: 0.85rem;
    color: var(--dim);
    margin-top: 0.5rem;
    line-height: 1.5;
  }

  /* Award buttons */
  .award-row {
    display: none;
    gap: 0.5rem;
    margin-top: 1.2rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .award-row.show { display: flex; }

  .award-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 0.6rem 1.2rem;
    border: 2px solid;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
  }

  .award-btn.correct-award {
    border-color: var(--correct);
    color: var(--correct);
  }

  .award-btn.correct-award:hover {
    background: var(--correct);
    color: var(--blue-1);
  }

  .award-btn.wrong-award {
    border-color: var(--wrong);
    color: var(--wrong);
  }

  .award-btn.wrong-award:hover {
    background: var(--wrong);
    color: white;
  }

  .award-btn.skip-award {
    border-color: var(--dim);
    color: var(--dim);
  }

  .award-btn.skip-award:hover {
    background: var(--dim);
    color: var(--blue-1);
  }

  /* === FINAL JEOPARDY === */
  .final-banner {
    text-align: center;
    padding: 2rem 1rem;
  }

  .final-banner h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .final-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--blue-glow);
    letter-spacing: 2px;
    margin-bottom: 1.5rem;
  }

  .final-q {
    font-size: 1.2rem;
    line-height: 1.7;
    max-width: 600px;
    margin: 0 auto 1.5rem;
  }

  .wager-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    margin: 1rem 0;
  }

  .wager-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--dim);
  }

  .wager-input {
    background: var(--blue-1);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    width: 150px;
    text-align: center;
    outline: none;
  }

  /* === END SCREEN === */
  #end-screen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  #end-screen.show { display: flex; }

  .end-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: 4px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1.5rem;
  }

  .final-scores {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    margin-bottom: 2rem;
  }

  .final-score-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    font-size: 1.2rem;
  }

  .final-score-row .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    min-width: 30px;
  }

  .final-score-row .f-name { font-weight: 700; }

  .final-score-row .f-pts {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
  }

  .play-again-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 2px;
    padding: 0.8rem 2.5rem;
    background: linear-gradient(180deg, var(--blue-glow), var(--blue-3));
    border: none;
    color: white;
    border-radius: 50px;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .board { gap: 3px; }
    .cell { min-height: 45px; padding: 0.5rem 0.2rem; }
    .q-modal { padding: 1.5rem; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="j-logo">CS JEOPARDY!</div>
  <div class="j-sub">EDEXCEL GCSE EDITION</div>
  <div class="setup-card">
    <h3>SET UP TEAMS</h3>
    <div class="team-setup" id="team-setup">
      <div class="team-row" data-idx="0">
        <span class="team-color" style="background:#ff4466"></span>
        <input type="text" placeholder="Team 1 name" maxlength="20">
      </div>
      <div class="team-row" data-idx="1">
        <span class="team-color" style="background:#44aaff"></span>
        <input type="text" placeholder="Team 2 name" maxlength="20">
      </div>
      <div class="team-row" data-idx="2">
        <span class="team-color" style="background:#44dd66"></span>
        <input type="text" placeholder="Team 3 name" maxlength="20">
      </div>
    </div>
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
      <button class="add-team-btn" onclick="addTeam()">+ ADD TEAM</button>
    </div>
    <button class="start-btn" onclick="startGame()">START GAME</button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div class="scoreboard" id="scoreboard"></div>
  <div class="turn-label" id="turn-label"></div>
  <div class="board" id="board"></div>
</div>

<!-- QUESTION MODAL -->
<div class="q-overlay" id="q-overlay">
  <div class="q-modal">
    <div class="q-cat-label" id="q-cat-label"></div>
    <div class="q-dd-banner" id="q-dd-banner">⭐ DAILY DOUBLE ⭐</div>
    <div class="q-points" id="q-points"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-answer-area">
      <button class="reveal-btn" id="reveal-btn" onclick="revealAnswer()">REVEAL ANSWER</button>
      <div class="answer-box" id="answer-box"></div>
      <div class="award-row" id="award-row"></div>
    </div>
  </div>
</div>

<!-- END SCREEN -->
<div id="end-screen">
  <div class="end-title">🏆 FINAL SCORES</div>
  <div class="final-scores" id="final-scores"></div>
  <button class="play-again-btn" onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
// === GAME DATA ===
const categories = [
  {
    name: "BINARY & HEX",
    questions: [
      { q: "Convert the binary number <code>1101</code> to denary.", a: "13", explain: "8 + 4 + 0 + 1 = 13" },
      { q: "How many different values can be represented by <strong>4 bits</strong>?", a: "16", explain: "2⁴ = 16 (values 0–15)" },
      { q: "Convert the denary number <strong>200</strong> to hexadecimal.", a: "C8", explain: "200 ÷ 16 = 12 remainder 8. 12 = C in hex, so C8" },
      { q: "What is <code>10101010</code> + <code>00001111</code> in binary? Give your answer in binary.", a: "10111001", explain: "170 + 15 = 185 = 10111001. Remember to carry when two 1s add up." }
    ]
  },
  {
    name: "DATA REPRESENTATION",
    questions: [
      { q: "What is the name of the character set that uses <strong>7 bits</strong> and can represent 128 characters?", a: "ASCII", explain: "American Standard Code for Information Interchange" },
      { q: "A sound file is sampled at 44,100 Hz with a bit depth of 16. What does <strong>bit depth</strong> determine?", a: "The number of possible values / accuracy of each sample", explain: "Higher bit depth = more precise recording of each sample's amplitude" },
      { q: "An image is 200×100 pixels with a colour depth of 24 bits. Calculate the file size in <strong>bits</strong>.", a: "480,000 bits", explain: "200 × 100 × 24 = 480,000 bits (60,000 bytes / ~58.6 KB)" },
      { q: "Why does <strong>lossy compression</strong> result in smaller files than lossless?", a: "It permanently removes data that is less noticeable to humans", explain: "Lossy discards data (e.g. sounds humans can't hear). Lossless compresses without losing any data." }
    ]
  },
  {
    name: "NETWORK NASTIES",
    questions: [
      { q: "What type of attack tricks a user into revealing personal information by pretending to be a trusted source?", a: "Phishing", explain: "Phishing uses fake emails/websites that look legitimate" },
      { q: "Name <strong>two</strong> ways to prevent unauthorised access to a network.", a: "Any two: Firewall, encryption, strong passwords, 2FA, access control, anti-malware", explain: "Multiple layers of security (defence in depth) is best practice" },
      { q: "What is the difference between a <strong>virus</strong> and a <strong>worm</strong>?", a: "A virus needs a host file/program to spread; a worm can self-replicate and spread independently", explain: "Worms don't need user action — they exploit network vulnerabilities" },
      { q: "Explain how <strong>SQL injection</strong> can be used to attack a website.", a: "Malicious SQL code is entered into input fields to manipulate the database — e.g. to access, delete or modify data", explain: "For example, entering ' OR 1=1 -- into a login form could bypass authentication" }
    ]
  },
  {
    name: "HARDWARE HEROES",
    questions: [
      { q: "Name the <strong>three components</strong> inside a CPU.", a: "ALU, Control Unit, Cache (registers also accepted)", explain: "ALU does calculations, CU manages execution, Cache stores frequently used data" },
      { q: "What is the purpose of <strong>secondary storage</strong>? Give one example.", a: "To store data permanently (non-volatile) when the power is off. E.g. SSD, HDD, USB", explain: "Unlike RAM, secondary storage retains data without power" },
      { q: "State <strong>two advantages</strong> of an SSD over an HDD.", a: "Any two: Faster read/write, no moving parts (more durable), lighter, quieter, less power", explain: "SSDs use flash memory — no spinning platters or read/write heads" },
      { q: "Explain how increasing the <strong>clock speed</strong> of a CPU affects performance.", a: "More cycles per second = more instructions executed per second = faster processing", explain: "But higher clock speed also generates more heat and uses more power" }
    ]
  },
  {
    name: "SYSTEMS & SOFTWARE",
    questions: [
      { q: "Give <strong>two</strong> functions of an operating system.", a: "Any two: Memory management, file management, user interface, peripheral management, security, multitasking", explain: "The OS manages hardware and provides an interface between the user and the computer" },
      { q: "What is the difference between <strong>utility software</strong> and <strong>application software</strong>?", a: "Utility software maintains/optimises the system (e.g. defrag, antivirus). Application software performs tasks for the user (e.g. Word, browser).", explain: "Utilities serve the system; applications serve the user" },
      { q: "What is <strong>virtual memory</strong> and when is it used?", a: "A section of the hard drive used as temporary RAM when physical RAM is full", explain: "It prevents crashes when RAM is full, but is much slower than actual RAM" },
      { q: "Describe the purpose of <strong>defragmentation</strong> and why SSDs don't need it.", a: "Defrag rearranges fragmented data on an HDD so files are stored contiguously, improving read speed. SSDs access any location equally fast (no moving head).", explain: "Defragging an SSD would actually reduce its lifespan due to unnecessary write operations" }
    ]
  }
];

const pointValues = [100, 200, 300, 400];
const teamColors = ['#ff4466','#44aaff','#44dd66','#ffaa22','#aa44ff','#ff44aa'];

let teams = [];
let currentTeamIdx = 0;
let currentQData = null;
let currentPoints = 0;
let isDailyDouble = false;
let dailyDoubleCell = null;
let questionsRemaining = 0;
let boardState = []; // [cat][row] = true if used

// === SETUP ===
function addTeam() {
  const container = document.getElementById('team-setup');
  const count = container.children.length;
  if (count >= 6) return;
  const row = document.createElement('div');
  row.className = 'team-row';
  row.dataset.idx = count;
  row.innerHTML = `
    <span class="team-color" style="background:${teamColors[count]}"></span>
    <input type="text" placeholder="Team ${count + 1} name" maxlength="20">
    <button class="remove-team-btn" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(row);
}

function startGame() {
  const rows = document.querySelectorAll('.team-row');
  teams = [];
  rows.forEach((row, i) => {
    const name = row.querySelector('input').value.trim() || `Team ${i + 1}`;
    teams.push({ name, color: teamColors[i] || teamColors[0], score: 0 });
  });

  if (teams.length < 2) {
    alert('You need at least 2 teams!');
    return;
  }

  // Pick random daily double
  const ddCat = Math.floor(Math.random() * 5);
  const ddRow = Math.floor(Math.random() * 4);
  dailyDoubleCell = `${ddCat}-${ddRow}`;

  // Init board state
  boardState = categories.map(() => [false, false, false, false]);
  questionsRemaining = 20;

  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.add('show');

  buildScoreboard();
  buildBoard();
  updateTurnLabel();
}

function buildScoreboard() {
  const el = document.getElementById('scoreboard');
  el.innerHTML = '';
  teams.forEach((t, i) => {
    const chip = document.createElement('div');
    chip.className = 'score-chip' + (i === 0 ? ' active' : '');
    chip.id = 'chip-' + i;
    chip.innerHTML = `<span class="score-dot" style="background:${t.color}"></span>
      <span class="score-name">${t.name}</span>
      <span class="score-pts" id="pts-${i}">0</span>`;
    el.appendChild(chip);
  });
}

function updateScoreboard() {
  teams.forEach((t, i) => {
    document.getElementById('pts-' + i).textContent = t.score;
    const chip = document.getElementById('chip-' + i);
    chip.classList.toggle('active', i === currentTeamIdx);
  });
}

function updateTurnLabel() {
  document.getElementById('turn-label').innerHTML =
    `<strong>${teams[currentTeamIdx].name}</strong> — PICK A CATEGORY AND VALUE`;
}

function buildBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  // Headers
  categories.forEach(cat => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.textContent = cat.name;
    el.appendChild(h);
  });
  // Cells
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 5; col++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${col}-${row}`;
      cell.textContent = pointValues[row];
      cell.onclick = () => openQuestion(col, row);
      el.appendChild(cell);
    }
  }
}

// === QUESTION FLOW ===
function openQuestion(cat, row) {
  if (boardState[cat][row]) return;
  boardState[cat][row] = true;
  questionsRemaining--;

  const cell = document.getElementById(`cell-${cat}-${row}`);
  cell.classList.add('used');

  currentQData = categories[cat].questions[row];
  currentPoints = pointValues[row];
  isDailyDouble = (dailyDoubleCell === `${cat}-${row}`);

  // Show modal
  document.getElementById('q-cat-label').textContent = categories[cat].name;
  document.getElementById('q-points').textContent = currentPoints + ' POINTS';
  document.getElementById('q-text').innerHTML = currentQData.q;
  document.getElementById('answer-box').classList.remove('show');
  document.getElementById('award-row').classList.remove('show');
  document.getElementById('reveal-btn').style.display = '';

  const ddBanner = document.getElementById('q-dd-banner');
  if (isDailyDouble) {
    ddBanner.classList.add('show');
    cell.classList.add('daily-double-reveal');
    // For daily double, points become the team's wager (simplified: just double the value)
    currentPoints = pointValues[row] * 2;
    document.getElementById('q-points').textContent = `DAILY DOUBLE! (${currentPoints} POINTS)`;
  } else {
    ddBanner.classList.remove('show');
  }

  document.getElementById('q-overlay').classList.add('show');
}

function revealAnswer() {
  const box = document.getElementById('answer-box');
  box.innerHTML = `${currentQData.a}<div class="answer-explain">${currentQData.explain}</div>`;
  box.classList.add('show');
  document.getElementById('reveal-btn').style.display = 'none';

  // Build award buttons for each team
  const row = document.getElementById('award-row');
  row.innerHTML = '';
  teams.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'award-btn correct-award';
    btn.innerHTML = `✓ ${t.name}`;
    btn.style.borderColor = t.color;
    btn.style.color = t.color;
    btn.onmouseover = () => { btn.style.background = t.color; btn.style.color = '#000'; };
    btn.onmouseout = () => { btn.style.background = 'transparent'; btn.style.color = t.color; };
    btn.onclick = () => awardPoints(i, true);
    row.appendChild(btn);
  });

  // Deduct button for current team
  const wrongBtn = document.createElement('button');
  wrongBtn.className = 'award-btn wrong-award';
  wrongBtn.textContent = `✕ WRONG (−${currentPoints})`;
  wrongBtn.onclick = () => awardPoints(currentTeamIdx, false);
  row.appendChild(wrongBtn);

  // Skip button
  const skipBtn = document.createElement('button');
  skipBtn.className = 'award-btn skip-award';
  skipBtn.textContent = 'SKIP / NO ANSWER';
  skipBtn.onclick = () => closeQuestion();
  row.appendChild(skipBtn);

  row.classList.add('show');
}

function awardPoints(teamIdx, correct) {
  if (correct) {
    teams[teamIdx].score += currentPoints;
  } else {
    teams[teamIdx].score -= currentPoints;
  }
  closeQuestion();
}

function closeQuestion() {
  document.getElementById('q-overlay').classList.remove('show');
  updateScoreboard();

  // Next team's turn
  currentTeamIdx = (currentTeamIdx + 1) % teams.length;
  updateScoreboard();
  updateTurnLabel();

  // Check if board is clear
  if (questionsRemaining <= 0) {
    setTimeout(() => showEndScreen(), 800);
  }
}

// === END ===
function showEndScreen() {
  document.getElementById('game').classList.remove('show');
  const screen = document.getElementById('end-screen');
  screen.classList.add('show');

  // Sort teams by score
  const sorted = [...teams].sort((a, b) => b.score - a.score);
  const container = document.getElementById('final-scores');
  container.innerHTML = '';

  const medals = ['🥇', '🥈', '🥉'];
  sorted.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'final-score-row';
    row.innerHTML = `
      <span class="rank">${medals[i] || (i + 1)}</span>
      <span class="score-dot" style="background:${t.color}; width:12px; height:12px; border-radius:50%; display:inline-block;"></span>
      <span class="f-name">${t.name}</span>
      <span class="f-pts">${t.score} pts</span>
    `;
    if (i === 0) row.style.fontSize = '1.5rem';
    container.appendChild(row);
  });
}
</script>
